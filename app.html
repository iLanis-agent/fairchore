<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FairChore - the chore split nobody can argue with</title>
<style>
  :root { --bg:#12161a; --panel:#1b2129; --line:#2c3540; --text:#edf1f5; --dim:#8e9aa8; --accent:#8be0a4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(680px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:16px; margin-bottom:10px; }
  .hint { color:var(--dim); font-size:13px; margin-top:8px; line-height:1.5; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:#232c37; border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:14px; display:flex; gap:8px; align-items:center; }
  .chip .x { color:var(--dim); cursor:pointer; font-weight:700; }
  .chip .x:hover { color:#e05252; }
  .adder { display:flex; gap:8px; margin-top:10px; }
  input[type=text] { flex:1; background:#12171d; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 12px; font-size:14px; }
  .adder button, .mini { background:#2a3542; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  table { width:100%; border-collapse:collapse; margin-top:6px; }
  th, td { text-align:left; padding:5px 6px; font-size:14px; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .rate { width:34px; height:30px; border-radius:8px; border:1px solid var(--line); background:#12171d; color:var(--text); font-weight:700; cursor:pointer; font-size:13px; }
  .rate.r1 { background:#1d5c38; } .rate.r2 { background:#2c7a48; } .rate.r3 { background:#6b6f35; } .rate.r4 { background:#8a5a2c; } .rate.r5 { background:#8a3636; }
  .go { background:var(--accent); color:#12161a; border:none; border-radius:9px; padding:11px 30px; font-size:16px; font-weight:800; cursor:pointer; margin:8px 0; }
  .result-head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; }
  .stat { color:var(--dim); font-size:13px; }
  .mate-card { background:#12171d; border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:10px; }
  .mate-card .name { font-weight:800; font-size:15px; }
  .mate-card .chores { margin-top:4px; font-size:14px; line-height:1.6; }
  .mate-card .misery { color:var(--dim); font-size:12px; margin-top:4px; }
  .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .foot { margin-top:16px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:#12161a; padding:8px 18px; border-radius:8px; font-weight:700; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>
<body>
<h1>FairChore</h1>
<div class="sub">everyone rates how much they hate each chore - the split minimizes total household misery</div>

<div class="card">
  <h2>1. Who lives here?</h2>
  <div class="chips" id="mate-chips"></div>
  <div class="adder">
    <input type="text" id="mate-input" maxlength="20" placeholder="Add a housemate">
    <button id="mate-add">Add</button>
  </div>
</div>

<div class="card">
  <h2>2. What needs doing?</h2>
  <div class="chips" id="chore-chips"></div>
  <div class="adder">
    <input type="text" id="chore-input" maxlength="30" placeholder="Add a chore">
    <button id="chore-add">Add</button>
  </div>
  <div class="hint">Tap a rating to cycle 1-5: 1 = "don't mind it", 5 = "would rather move out".</div>
</div>

<div class="card" id="rate-card">
  <h2>3. Rate the hate</h2>
  <div id="rate-grid"></div>
</div>

<button class="go" id="split">Split fairly</button>

<div class="card" id="result-card" style="display:none">
  <div class="result-head">
    <h2>The split</h2>
    <span class="stat" id="savings"></span>
  </div>
  <div id="results"></div>
  <div class="actions">
    <button class="mini" id="copy">Copy as text</button>
    <button class="mini" id="resplit">Re-split</button>
  </div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>
<div id="toast"></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var DEFAULT_CHORES = ['Dishes', 'Trash out', 'Bathroom', 'Vacuum', 'Kitchen counters', 'Laundry'];
  var state = { mates: [], chores: [], ratings: {} }; // ratings[mate][chore] = 1..5

  function save() { try { localStorage.setItem('fairchore', JSON.stringify(state)); } catch (e) {} }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem('fairchore'));
      if (s && s.mates && s.chores && s.ratings) state = s;
    } catch (e) {}
    if (!state.mates.length && !state.chores.length) {
      state.chores = DEFAULT_CHORES.slice();
    }
  }

  function rating(mate, chore) {
    if (!state.ratings[mate]) state.ratings[mate] = {};
    return state.ratings[mate][chore] || 3;
  }
  function cycleRating(mate, chore) {
    if (!state.ratings[mate]) state.ratings[mate] = {};
    state.ratings[mate][chore] = rating(mate, chore) % 5 + 1;
    save();
  }

  function renderChips(elId, items, onRemove) {
    var el = document.getElementById(elId);
    el.innerHTML = '';
    items.forEach(function (name) {
      var c = document.createElement('span');
      c.className = 'chip';
      c.textContent = name + ' ';
      var x = document.createElement('span');
      x.className = 'x'; x.textContent = 'x';
      x.addEventListener('click', function () { onRemove(name); });
      c.appendChild(x);
      el.appendChild(c);
    });
  }

  function renderGrid() {
    var grid = document.getElementById('rate-grid');
    if (!state.mates.length || !state.chores.length) {
      grid.innerHTML = '<div class="hint">Add at least one housemate and one chore.</div>';
      return;
    }
    var html = '<table><thead><tr><th>Chore</th>';
    state.mates.forEach(function (m) { html += '<th>' + esc(m) + '</th>'; });
    html += '</tr></thead><tbody>';
    state.chores.forEach(function (ch, ci) {
      html += '<tr><td>' + esc(ch) + '</td>';
      state.mates.forEach(function (m, mi) {
        html += '<td><button class="rate r' + rating(m, ch) + '" data-mi="' + mi + '" data-ci="' + ci + '">' + rating(m, ch) + '</button></td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    grid.innerHTML = html;
    grid.querySelectorAll('.rate').forEach(function (b) {
      b.addEventListener('click', function () {
        var m = state.mates[+b.getAttribute('data-mi')];
        var ch = state.chores[+b.getAttribute('data-ci')];
        cycleRating(m, ch);
        b.className = 'rate r' + rating(m, ch);
        b.textContent = rating(m, ch);
      });
    });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function renderAll() {
    renderChips('mate-chips', state.mates, function (name) {
      state.mates = state.mates.filter(function (m) { return m !== name; });
      delete state.ratings[name];
      save(); renderAll();
    });
    renderChips('chore-chips', state.chores, function (name) {
      state.chores = state.chores.filter(function (c) { return c !== name; });
      save(); renderAll();
    });
    renderGrid();
  }

  function addItem(inputId, list, render) {
    var inp = document.getElementById(inputId);
    var v = inp.value.trim();
    if (!v || list.indexOf(v) !== -1 || list.length >= 12) return;
    list.push(v);
    inp.value = '';
    save(); render();
  }

  document.getElementById('mate-add').addEventListener('click', function () { addItem('mate-input', state.mates, renderAll); });
  document.getElementById('chore-add').addEventListener('click', function () { addItem('chore-input', state.chores, renderAll); });
  document.getElementById('mate-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') addItem('mate-input', state.mates, renderAll); });
  document.getElementById('chore-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') addItem('chore-input', state.chores, renderAll); });

  var lastText = '';

  function split() {
    if (!state.mates.length || !state.chores.length) { toast('Add housemates and chores first'); return; }
    var dislike = state.mates.map(function (m) {
      return state.chores.map(function (ch) { return rating(m, ch); });
    });
    var res = FairChore.assign(state.mates, state.chores, dislike);
    var totals = FairChore.mateTotals(res.byMate, dislike);
    // round-robin baseline for comparison
    var rr = 0;
    for (var c = 0; c < state.chores.length; c++) rr += dislike[c % state.mates.length][c];
    var savedPct = rr > 0 ? Math.round((rr - res.total) / rr * 100) : 0;

    var out = document.getElementById('results');
    out.innerHTML = '';
    var lines = [];
    state.mates.forEach(function (m, mi) {
      var card = document.createElement('div');
      card.className = 'mate-card';
      var names = res.byMate[mi].map(function (ci) { return state.chores[ci]; });
      card.innerHTML = '<div class="name">' + esc(m) + '</div><div class="chores">' + names.map(esc).join(' - ') + '</div><div class="misery">misery ' + totals[mi] + ' - ' + names.length + ' chores</div>';
      out.appendChild(card);
      lines.push(m + ': ' + names.join(', '));
    });
    document.getElementById('savings').textContent =
      'household misery ' + res.total + (savedPct > 0 ? ' - ' + savedPct + '% less than taking turns' : ' - same as taking turns, but balanced');
    document.getElementById('result-card').style.display = 'block';
    lastText = 'FairChore split\n' + lines.join('\n') + '\n(household misery ' + res.total + ')';
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(function () { t.style.opacity = '0'; }, 1800);
  }

  document.getElementById('split').addEventListener('click', split);
  document.getElementById('resplit').addEventListener('click', split);
  document.getElementById('copy').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(function () { toast('Copied - paste it in the group chat'); });
    } else {
      toast('Clipboard not available');
    }
  });

  // test hook
  window.__fc = {
    state: function () { return JSON.parse(JSON.stringify(state)); },
    setState: function (s) { state = s; save(); renderAll(); },
    split: split
  };

  load();
  renderAll();
})();
</script>
</body>
</html>
